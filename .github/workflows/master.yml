name: Build
on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: false

jobs:
  buildroot:
    name: Firmware
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ssc338q_fpv_openipc-urllc-aio

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}
          INPUT=${{inputs.platform}}
          MATRIX=$(echo ${{matrix.platform}} | cut -d_ -f1)
          if [ -z ${INPUT} ] || [ ${INPUT} = ${MATRIX} ]; then
            echo RUN=${MATRIX} >> ${GITHUB_ENV}
          fi

      # Resolve mabur and devourer master once, up front. The package .mk
      # files take MABUR_VERSION/DEVOURER_VERSION from the environment, so the
      # build uses exactly these commits and the release is named after the
      # mabur one -- the same mabur-<sha8> name the ground-station image repo
      # gives its build of that commit, which is how a VTX and a GS release
      # are matched.
      - name: Resolve sources
        if: env.RUN
        run: |
          MABUR_VERSION=$(git ls-remote https://github.com/gilankpam/mabur refs/heads/master | cut -f1)
          DEVOURER_VERSION=$(git ls-remote https://github.com/gilankpam/devourer refs/heads/master | cut -f1)
          if [ -z "${MABUR_VERSION}" ] || [ -z "${DEVOURER_VERSION}" ]; then
            exit 1
          fi
          echo MABUR_VERSION=${MABUR_VERSION} >> ${GITHUB_ENV}
          echo DEVOURER_VERSION=${DEVOURER_VERSION} >> ${GITHUB_ENV}
          echo TAG_NAME=mabur-${MABUR_VERSION:0:8} >> ${GITHUB_ENV}

      - name: Setup ccache
        if: env.RUN
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}-${{env.CACHE_DATE}}

      - name: Build firmware
        if: env.RUN
        run: |
          export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache

          NAME=${{matrix.platform}}
          bash builder.sh ${NAME}
          cd openipc

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}
          COMMON=$(echo ${NAME} | awk -F_ '{print NF-1}')

          NORFW=$(find output/images -name openipc*nor*)
          if [ ! -z ${NORFW} ]; then
            if [ ${COMMON} -eq 1 ]; then
              echo NORFW=openipc/${NORFW} >> ${GITHUB_ENV}
            else
              mv ${NORFW} ../${NAME}-nor.tgz
              echo NORFW=${NAME}-nor.tgz >> ${GITHUB_ENV}
            fi
          fi

          NANDFW=$(find output/images -name openipc*nand*)
          if [ ! -z ${NANDFW} ]; then
            if [ ${COMMON} -eq 1 ]; then
              echo NANDFW=openipc/${NANDFW} >> ${GITHUB_ENV}
            else
              mv ${NANDFW} ../${NAME}-nand.tgz
              echo NANDFW=${NAME}-nand.tgz >> ${GITHUB_ENV}
            fi
          fi

          if [ -z ${NORFW} ] && [ -z ${NANDFW} ]; then
            exit 1
          fi

          # builder.sh builds U-Boot from our fork after the device build and
          # leaves it in output/images; it is absent for SoCs with no family
          # mapping, so ship it only when it is there.  Padded to the whole
          # 256k boot partition, i.e. the one to flashcp to /dev/mtd0.
          SOC=$(echo ${NAME} | cut -d_ -f1)
          UBOOT=output/images/u-boot-${SOC}-nor-padded.bin
          if [ -f ${UBOOT} ]; then
            echo UBOOT=openipc/${UBOOT} >> ${GITHUB_ENV}
          fi

          # Release body: a build header, the md5 of the bootloader -- the
          # runbook has the operator compare md5 twice, before flashing and
          # again on the readback, and without a published value there is
          # nothing to compare against -- then the runbook itself.
          {
            echo "VTX firmware built from mabur \`${MABUR_VERSION:0:8}\`."
            echo "Flash it with the ground-station release of the same name:"
            echo "https://github.com/gilankpam/sbc-groundstations/releases/tag/${TAG_NAME}"
            echo
            echo "- Platform: \`${NAME}\`"
            echo "- mabur: \`${MABUR_VERSION}\`"
            echo "- devourer: \`${DEVOURER_VERSION}\`"
            echo "- Builder commit: \`${GIT_HASH}\` (\`${GIT_BRANCH}\`)"
            if [ -f ${UBOOT} ]; then
              echo
              echo "| file | md5 |"
              echo "|---|---|"
              echo "| \`$(basename ${UBOOT})\` | \`$(md5sum ${UBOOT} | cut -d' ' -f1)\` |"
              echo
              # Guarded: `run:` steps are `bash -e`, and a bad release
              # body is not worth failing a firmware build over.
              if [ -f ../docs/flash-uboot.md ]; then cat ../docs/flash-uboot.md; fi
            fi
          } > ../release-notes.md
          echo NOTES=release-notes.md >> ${GITHUB_ENV}

      # Only a manual run publishes; a push just builds. A rerun of the same
      # mabur commit replaces that release's files. No target_commitish: the
      # GITHUB_TOKEN may not point a tag at a commit that changes a workflow
      # file ("Resource not accessible by integration"), and this branch's
      # workflow differs from master's, so the tag is left to default to
      # master and the notes carry the builder commit instead.
      - name: Upload firmware
        if: (env.NORFW || env.NANDFW) && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.TAG_NAME}}
          name: ${{env.TAG_NAME}}
          prerelease: false
          make_latest: true
          body_path: ${{env.NOTES}}
          files: |
            ${{env.NORFW}}
            ${{env.NANDFW}}
            ${{env.UBOOT}}

      - name: Send binary
        if: env.NORFW
        run: |
          TG_MSG="Commit: ${GIT_HASH}\nBranch: ${GIT_BRANCH}\nTag: ${TAG_NAME}\nTime: ${TIME}\n\n"
          TG_ICON="\xE2\x9C\x85 GitHub Actions"
          TG_HEADER=$(echo -e ${TG_MSG}${TG_ICON})
          TG_TOKEN=${{secrets.TELEGRAM_TOKEN_BOT_OPENIPC}}
          TG_CHANNEL=${{secrets.TELEGRAM_CHANNEL_OPENIPC_DEV}}
          HTTP=$(curl -s -o /dev/null -w %{http_code} https://api.telegram.org/bot${TG_TOKEN}/sendDocument -F chat_id=${TG_CHANNEL} -F caption="${TG_HEADER}" -F document=@${NORFW})
          echo Telegram response: ${HTTP}
